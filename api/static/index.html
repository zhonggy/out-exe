<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OutlookAutomation 控制台</title>
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #171d26; --panel2: #1e2632; --line: #2b3543;
    --fg: #e6edf3; --muted: #8b98a8; --accent: #4c9aff; --ok: #3fb950;
    --warn: #d29922; --err: #f85149; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge {
    padding: 2px 8px; border-radius: 10px; font-size: 12px;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  .badge.off { color: var(--muted); }
  nav { display: flex; gap: 4px; padding: 0 20px; background: var(--panel);
        border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 10px 14px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  nav button.active { color: var(--fg); border-bottom-color: var(--accent); }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button.btn {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.danger { color: var(--err); border-color: #4a2222; }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 13px;
  }
  textarea { width: 100%; min-height: 140px; font-family: Consolas, monospace; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { background: var(--panel2); color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .st { padding: 1px 7px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .st.OK, .st.COMPLETED { color: var(--ok); border-color: var(--ok); }
  .st.RUNNING, .st.QUEUED, .st.PENDING { color: var(--accent); border-color: var(--accent); }
  .st.WAIT_VERIFY, .st.PAUSED { color: var(--warn); border-color: var(--warn); }
  .st.FAILED, .st.PASSWORD_WRONG, .st.LOCKED, .st.NOT_FOUND, .st.CANCELLED { color: var(--err); border-color: var(--err); }
  pre.logs {
    background: #0b0f14; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; max-height: 62vh; overflow: auto; font: 12px/1.6 Consolas, monospace; margin: 0;
  }
  .lg { display: block; white-space: pre-wrap; word-break: break-all; }
  .lg.WARN { color: var(--warn); } .lg.ERROR, .lg.FAIL { color: var(--err); }
  .lg.OK { color: var(--ok); } .lg.DEBUG { color: var(--muted); }
  .muted { color: var(--muted); }
  .toast {
    position: fixed; right: 20px; bottom: 20px; background: var(--panel2);
    border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 16px; z-index: 99;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .warnbox { background: #2b2416; border: 1px solid var(--warn); color: #ffd479;
             padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; }
  h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .sec { margin-bottom: 22px; }
  .ctrl2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
           background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 16px; }
  .ctrl-col { display: flex; flex-direction: column; gap: 10px; }
  .ctrl-label { color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) { .ctrl2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>OutlookAutomation</h1>
    <span class="badge" :class="stats.task && stats.task.running ? 'on' : 'off'">
      {{ stats.task && stats.task.running ? '运行中' : '已停止' }}
    </span>
    <span class="badge">Worker {{ workerCount }}</span>
    <span class="badge">队列 {{ queueSize }}</span>
    <span class="badge">浏览器 {{ (stats.task && stats.task.browsers) || 0 }}</span>
    <span class="muted" style="margin-left:auto" v-if="lastUpdate">更新于 {{ lastUpdate }}</span>
    <button class="btn" @click="refreshAll">刷新</button>
  </header>

  <nav>
    <button v-for="t in tabs" :key="t.k" :class="{active: tab===t.k}" @click="tab=t.k">{{ t.n }}</button>
  </nav>

  <main>
    <div v-if="needToken" class="sec">
      <div class="warnbox">接口已开启 Token 认证。Token 在启动日志中打印，也可在 data/api_token 查看。</div>
      <div class="row">
        <input v-model="tokenInput" type="password" placeholder="X-API-Token" style="width:340px" @keyup.enter="saveToken" />
        <button class="btn primary" @click="saveToken">保存并连接</button>
      </div>
    </div>

    <template v-else>
      <!-- 概览 -->
      <section v-show="tab==='dash'">
        <div class="cards">
          <div class="card"><div class="label">账号总数</div><div class="value">{{ acc.total || 0 }}</div></div>
          <div class="card"><div class="label">待处理</div><div class="value">{{ acc.pending || 0 }}</div></div>
          <div class="card"><div class="label">登录成功</div><div class="value" style="color:var(--ok)">{{ acc.ok || 0 }}</div></div>
          <div class="card"><div class="label">已处理任务</div><div class="value">{{ (stats.task && stats.task.processed) || 0 }}</div></div>
          <div class="card"><div class="label">失败任务</div><div class="value" style="color:var(--err)">{{ (stats.task && stats.task.failed) || 0 }}</div></div>
          <div class="card">
            <div class="label">验证码通过率</div>
            <div class="value">{{ captchaRate }}</div>
          </div>
        </div>

        <div class="sec">
          <h3>运行控制</h3>
          <div class="ctrl2">
            <div class="ctrl-col">
              <div class="row"><span class="ctrl-label">Worker 数量</span><input v-model.number="workerInput" type="number" min="1" max="16" style="width:90px" /></div>
              <div class="row">
                <button class="btn primary" @click="post('/api/workers/start', {workers: workerInput})">启动 Worker</button>
                <button class="btn" @click="post('/api/workers/stop')">停止</button>
                <button class="btn" @click="post('/api/workers/restart', {workers: workerInput})">重启</button>
                <button class="btn danger" @click="post('/api/browsers/close_all')">关闭全部浏览器</button>
              </div>
            </div>
            <div class="ctrl-col">
              <div class="row"><span class="ctrl-label">派发数量</span><input v-model.number="batchLimit" type="number" min="1" style="width:90px" /></div>
              <div class="row">
                <button class="btn primary" @click="post('/api/tasks/batch', {limit: batchLimit, type: 'login'})">批量派发登录任务</button>
                <button class="btn" @click="post('/api/queue/clear')">清空队列</button>
              </div>
            </div>
          </div>
        </div>

        <div class="sec">
          <h3>Worker 状态</h3>
          <table>
            <thead><tr><th>Worker</th><th>状态</th><th>处理</th><th>成功</th><th>失败</th><th>当前任务</th><th>当前账号</th></tr></thead>
            <tbody>
              <tr v-for="w in workers" :key="w.index">
                <td>{{ w.name }}</td>
                <td><span class="st" :class="w.alive ? 'RUNNING' : 'FAILED'">{{ w.alive ? '存活' : '已停' }}</span></td>
                <td>{{ w.processed }}</td><td>{{ w.succeeded }}</td><td>{{ w.failed }}</td>
                <td>{{ w.current_task || '-' }}</td><td>{{ w.current_account || '-' }}</td>
              </tr>
              <tr v-if="!workers.length"><td colspan="7" class="muted">未启动</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 账号 -->
      <section v-show="tab==='acc'">
        <div class="row">
          <select v-model="accFilter" @change="loadAccounts">
            <option value="">全部状态</option>
            <option v-for="s in accStatuses" :key="s" :value="s">{{ s }}</option>
          </select>
          <button class="btn" @click="loadAccounts">刷新</button>
          <button class="btn primary" @click="post('/api/accounts/import').then(loadAccounts)">从 accounts.txt 导入</button>
          <a class="btn" :href="exportUrl" target="_blank" style="text-decoration:none">导出 CSV</a>
        </div>
        <div class="grid2 sec">
          <div>
            <h3>粘贴导入（账号----密码，每行一个）</h3>
            <textarea v-model="importText" placeholder="a@example.com----password1"></textarea>
            <div class="row" style="margin-top:8px">
              <button class="btn primary" @click="importAccounts">导入文本</button>
            </div>
          </div>
          <div>
            <h3>单个添加</h3>
            <div class="row"><input v-model="newAcc.account" placeholder="账号" style="width:100%" /></div>
            <div class="row"><input v-model="newAcc.password" placeholder="密码" style="width:100%" /></div>
            <div class="row"><button class="btn primary" @click="addAccount">添加</button></div>
          </div>
        </div>
        <table>
          <thead><tr><th>ID</th><th>账号</th><th>状态</th><th>备注</th><th>执行</th><th>失败</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="a in accounts" :key="a.id">
              <td>{{ a.id }}</td><td>{{ a.account }}</td>
              <td><span class="st" :class="a.status">{{ a.status_label || a.status }}</span></td>
              <td class="muted">{{ a.note }}</td><td>{{ a.run_count }}</td><td>{{ a.fail_count }}</td>
              <td>
                <button class="btn" @click="runOne(a.account)">登录</button>
                <button class="btn" @click="post('/api/accounts/'+encodeURIComponent(a.account)+'/reset').then(loadAccounts)">重置</button>
                <button class="btn danger" @click="del('/api/accounts/'+encodeURIComponent(a.account)).then(loadAccounts)">删除</button>
              </td>
            </tr>
            <tr v-if="!accounts.length"><td colspan="7" class="muted">暂无账号</td></tr>
          </tbody>
        </table>
      </section>

      <!-- 任务 -->
      <section v-show="tab==='task'">
        <div class="row">
          <select v-model="taskFilter" @change="loadTasks">
            <option value="">全部状态</option>
            <option v-for="s in taskStatuses" :key="s" :value="s">{{ s }}</option>
          </select>
          <button class="btn" @click="loadTasks">刷新</button>
          <button class="btn danger" @click="post('/api/tasks/clear').then(loadTasks)">清空任务记录</button>
        </div>
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>账号</th><th>状态</th><th>阶段</th><th>尝试</th><th>耗时</th><th>结果/错误</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="t in tasks" :key="t.id">
              <td>{{ t.id }}</td><td>{{ t.type }}</td><td>{{ t.account }}</td>
              <td><span class="st" :class="t.status">{{ t.status }}</span></td>
              <td class="muted">{{ t.stage }}</td>
              <td>{{ t.attempt }}/{{ t.max_attempt }}</td>
              <td>{{ t.duration ? t.duration.toFixed(1)+'s' : '-' }}</td>
              <td class="muted">{{ t.error || t.result }}</td>
              <td>
                <button class="btn" @click="showTask(t.id)">详情</button>
                <button class="btn" @click="post('/api/tasks/'+t.id+'/cancel').then(loadTasks)">取消</button>
              </td>
            </tr>
            <tr v-if="!tasks.length"><td colspan="9" class="muted">暂无任务</td></tr>
          </tbody>
        </table>
        <div v-if="taskDetail" class="sec" style="margin-top:16px">
          <h3>任务 {{ taskDetail.task.id }} 断点时间线</h3>
          <table>
            <thead><tr><th>时间</th><th>阶段</th><th>数据</th></tr></thead>
            <tbody>
              <tr v-for="(c,i) in taskDetail.checkpoints" :key="i">
                <td>{{ c.at }}</td><td>{{ c.stage }}</td><td class="muted">{{ JSON.stringify(c.data) }}</td>
              </tr>
              <tr v-if="!taskDetail.checkpoints.length"><td colspan="3" class="muted">无断点记录</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 浏览器 / Profile -->
      <section v-show="tab==='env'">
        <div class="sec">
          <h3>活跃浏览器实例</h3>
          <table>
            <thead><tr><th>Key</th><th>账号</th><th>Profile</th><th>代理</th><th>时区</th><th>当前 URL</th></tr></thead>
            <tbody>
              <tr v-for="b in browsers" :key="b.key">
                <td>{{ b.key }}</td><td>{{ b.account || '-' }}</td><td>{{ b.profile || '-' }}</td>
                <td>{{ b.proxy || 'direct' }}</td><td>{{ b.timezone }}</td>
                <td class="muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis">{{ b.url }}</td>
              </tr>
              <tr v-if="!browsers.length"><td colspan="6" class="muted">无活跃实例</td></tr>
            </tbody>
          </table>
        </div>
        <div class="sec">
          <h3>浏览器环境（Profile）<span class="muted" v-if="profiles.total_mb"> 共 {{ profiles.total_mb }} MB</span></h3>
          <div class="row">
            <button class="btn" @click="loadEnv">刷新</button>
            <button class="btn" @click="post('/api/profiles/clear_temp').then(loadEnv)">清理临时环境</button>
            <button class="btn" @click="post('/api/profiles/prune?days=30').then(loadEnv)">清理 30 天未用</button>
          </div>
          <table>
            <thead><tr><th>Profile ID</th><th>大小</th><th>类型</th><th>占用</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="p in (profiles.profiles||[])" :key="p.profile_id">
                <td>{{ p.profile_id }}</td><td>{{ p.size_mb }} MB</td>
                <td>{{ p.temporary ? '临时' : '固定' }}</td>
                <td>{{ p.in_use ? '使用中' : '空闲' }}</td>
                <td><button class="btn danger" :disabled="p.in_use" @click="del('/api/profiles/'+p.profile_id).then(loadEnv)">删除</button></td>
              </tr>
              <tr v-if="!(profiles.profiles||[]).length"><td colspan="5" class="muted">暂无环境目录</td></tr>
            </tbody>
          </table>
        </div>
        <div class="sec">
          <h3>代理表现</h3>
          <div class="row">
            <span class="badge">{{ proxy.direct ? '直连模式' : proxy.type + '://' + proxy.host + ' × ' + proxy.ports }}</span>
            <button class="btn" @click="post('/api/proxy/reset').then(loadEnv)">重置统计</button>
            <button class="btn" @click="pickProxy">测试选取</button>
          </div>
          <table v-if="(proxy.tracker||[]).length">
            <thead><tr><th>代理</th><th>成功</th><th>总计</th><th>通过率</th><th>状态</th></tr></thead>
            <tbody>
              <tr v-for="p in proxy.tracker" :key="p.proxy">
                <td>{{ p.proxy }}</td><td>{{ p.win }}</td><td>{{ p.total }}</td>
                <td>{{ p.rate === null ? '-' : p.rate + '%' }}</td>
                <td><span class="st" :class="p.blacklisted ? 'FAILED' : 'OK'">{{ p.blacklisted ? '已拉黑' : '可用' }}</span></td>
              </tr>
            </tbody>
          </table>
          <p v-else class="muted">暂无代理使用记录</p>
        </div>
      </section>

      <!-- 配置 -->
      <section v-show="tab==='cfg'">
        <div class="warnbox">
          以 JSON 格式编辑，保存时自动生成合法 YAML（避免手改语法错误）。
          api.token 不可在此修改；改动 resin/proxy 等运行参数后需重启 Worker 生效。
        </div>
        <div class="row">
          <button class="btn" @click="loadCfg">重新加载</button>
          <button class="btn primary" @click="saveCfg">保存配置</button>
          <span class="muted" v-if="cfgPath">{{ cfgPath }}</span>
        </div>
        <textarea v-model="cfgText" spellcheck="false" style="min-height:480px;font-size:12px"></textarea>
      </section>

      <!-- 日志 -->
      <section v-show="tab==='log'">
        <div class="row">
          <select v-model="logLevel"><option value="">全部级别</option>
            <option>DEBUG</option><option>INFO</option><option>OK</option><option>WARN</option><option>ERROR</option><option>FAIL</option>
          </select>
          <label class="muted"><input type="checkbox" v-model="autoScroll" /> 自动滚动</label>
          <button class="btn" @click="logs=[]; logCursor=0">清屏</button>
        </div>
        <pre class="logs" ref="logbox"><span v-for="l in filteredLogs" :key="l.seq" class="lg" :class="l.level">[{{ l.time }}] [{{ l.level }}] [{{ l.flow }}/{{ l.stage }}]{{ l.account ? ' '+l.account : '' }} {{ l.message }}</span></pre>
      </section>
    </template>
  </main>

  <div v-if="toast" class="toast">{{ toast }}</div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      tabs: [
        {k:'dash', n:'概览'}, {k:'acc', n:'账号'}, {k:'task', n:'任务'},
        {k:'env', n:'浏览器/代理'}, {k:'log', n:'日志'}, {k:'cfg', n:'配置'}
      ],
      tab: 'dash',
      token: localStorage.getItem('oa_token') || '',
      tokenInput: '',
      authEnabled: true,
      authOk: false,
      stats: {}, accounts: [], tasks: [], browsers: [], profiles: {}, proxy: {},
      logs: [], logCursor: 0, logLevel: '', autoScroll: true,
      accFilter: '', taskFilter: '', importText: '', taskDetail: null,
      newAcc: { account: '', password: '' },
      workerInput: 3, batchLimit: 20,
      toast: '', lastUpdate: '',
      accStatuses: ['NEW','PENDING','RUNNING','OK','WAIT_VERIFY','PASSWORD_WRONG','LOCKED','NOT_FOUND','FAILED','SKIPPED'],
      taskStatuses: ['CREATED','QUEUED','RUNNING','COMPLETED','FAILED','CANCELLED'],
      timer: null,
      cfgText: '',
      cfgPath: ''
    };
  },
  computed: {
    needToken() { return this.authEnabled && !this.authOk; },
    workers() { return (this.stats.task && this.stats.task.workers) || []; },
    workerCount() { return (this.stats.task && this.stats.task.worker_count) || 0; },
    queueSize() { return (this.stats.task && this.stats.task.queue && this.stats.task.queue.size) || 0; },
    acc() { return (this.stats.task && this.stats.task.accounts) || {}; },
    captchaRate() {
      const c = this.stats.captcha;
      if (!c || !c.attempts) return '-';
      return c.rate + '% (' + c.success + '/' + c.attempts + ')';
    },
    exportUrl() { return '/api/accounts/export'; },
    filteredLogs() {
      return this.logLevel ? this.logs.filter(l => l.level === this.logLevel) : this.logs;
    }
  },
  methods: {
    headers() {
      const h = { 'Content-Type': 'application/json' };
      if (this.token) h['X-API-Token'] = this.token;
      return h;
    },
    async req(url, opt = {}) {
      const res = await fetch(url, { headers: this.headers(), ...opt });
      if (res.status === 401) { this.authOk = false; throw new Error('Token 无效'); }
      if (!res.ok) {
        let msg = res.statusText;
        try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
        throw new Error(msg);
      }
      return res.json();
    },
    async post(url, body) {
      try {
        const data = await this.req(url, { method: 'POST', body: body ? JSON.stringify(body) : null });
        this.notify('操作成功');
        await this.loadStats();
        return data;
      } catch (e) { this.notify('失败: ' + e.message); throw e; }
    },
    async del(url) {
      try { const d = await this.req(url, { method: 'DELETE' }); this.notify('已删除'); return d; }
      catch (e) { this.notify('失败: ' + e.message); throw e; }
    },
    notify(msg) { this.toast = msg; setTimeout(() => { this.toast = ''; }, 2200); },
    saveToken() {
      this.token = this.tokenInput.trim();
      localStorage.setItem('oa_token', this.token);
      // 直接用新 token 验证并拉数据；不能走 refreshAll（needToken 门控会拦住首次验证）
      this.loadStats()
        .then(() => {
          this.notify('连接成功');
          return Promise.all([this.loadAccounts(), this.loadTasks(), this.loadEnv(), this.loadLogs()]);
        })
        .catch(e => this.notify('Token 验证失败: ' + e.message));
    },
    async loadMeta() {
      const m = await (await fetch('/api/meta')).json();
      this.authEnabled = m.auth_enabled;
      if (!m.auth_enabled) this.authOk = true;
    },
    async loadCfg() {
      const d = await this.req('/api/config');
      this.cfgPath = d.path || '';
      this.cfgText = JSON.stringify(d.config !== undefined ? d.config : d, null, 2);
    },
    async saveCfg() {
      let data;
      try {
        data = JSON.parse(this.cfgText);
      } catch (e) {
        return this.notify('JSON 格式错误：' + e.message);
      }
      try {
        const r = await this.req('/api/config', { method: 'PUT', body: JSON.stringify({data}) });
        this.cfgPath = r.path;
        this.cfgText = JSON.stringify(r.config, null, 2);
        this.notify('配置已保存。涉及运行参数的改动需重启 Worker 生效');
      } catch (e) {
        this.notify('保存失败: ' + e.message);
      }
    },

    async loadStats() {
      const s = await this.req('/api/stats');
      this.stats = s; this.authOk = true;
      this.lastUpdate = new Date().toLocaleTimeString();
      if (s.task && s.task.worker_count) this.workerInput = s.task.worker_count;
    },
    async loadAccounts() {
      const d = await this.req('/api/accounts?limit=500' + (this.accFilter ? '&status=' + this.accFilter : ''));
      this.accounts = d.items;
    },
    async loadTasks() {
      const d = await this.req('/api/tasks?limit=200' + (this.taskFilter ? '&status=' + this.taskFilter : ''));
      this.tasks = d.items;
    },
    async loadEnv() {
      this.browsers = (await this.req('/api/browsers')).items;
      this.profiles = await this.req('/api/profiles');
      this.proxy = await this.req('/api/proxy');
    },
    async loadLogs() {
      const d = await this.req('/api/logs?limit=300&after=' + this.logCursor);
      if (d.items.length) {
        this.logs.push(...d.items);
        if (this.logs.length > 1500) this.logs.splice(0, this.logs.length - 1500);
        this.logCursor = d.cursor;
        if (this.autoScroll) this.$nextTick(() => {
          const box = this.$refs.logbox; if (box) box.scrollTop = box.scrollHeight;
        });
      }
    },
    async showTask(id) { this.taskDetail = await this.req('/api/tasks/' + id); },
    async runOne(account) {
      // 一键单账号测试：确保执行进程在跑（没启动则自动拉起），再入队并跳到任务页
      try {
        const s = await this.req('/api/stats');
        if (!s.task.running) {
          await this.post('/api/workers/start', {workers: this.workerInput || 1});
          await new Promise(r => setTimeout(r, 2500));
        }
      } catch (e) { /* 启动失败也让任务先入队 */ }
      await this.post('/api/tasks', { account, type: 'login' });
      this.tab = 'task';
      await this.loadTasks();
    },
    async addAccount() {
      if (!this.newAcc.account) return this.notify('请填写账号');
      await this.post('/api/accounts', this.newAcc);
      this.newAcc = { account: '', password: '' };
      await this.loadAccounts();
    },
    async importAccounts() {
      const d = await this.post('/api/accounts/import', { text: this.importText });
      this.notify('导入 ' + d.imported + ' 个，跳过 ' + d.skipped);
      this.importText = '';
      await this.loadAccounts();
    },
    async pickProxy() {
      const d = await this.req('/api/proxy/pick');
      this.notify('选中 ' + d.proxy + ' / ' + (d.info.country || '?') + ' ' + (d.info.timezone || ''));
    },
    async refreshAll() {
      try {
        await this.loadMeta();
        if (this.needToken) return;
        await this.loadStats();
        await Promise.all([this.loadAccounts(), this.loadTasks(), this.loadEnv(), this.loadLogs()]);
      } catch (e) { /* 未认证时静默 */ }
    },
    tick() {
      if (this.needToken) return;
      if (document.hidden) return;          // 页面不在前台时不轮询
      this._tickCount = (this._tickCount || 0) + 1;
      this.loadStats().catch(() => {});
      this.loadLogs().catch(() => {});
      // 标签页数据降频到每 9 秒，减轻连接压力
      if (this._tickCount % 3 === 0) {
        if (this.tab === 'task') this.loadTasks().catch(() => {});
        if (this.tab === 'acc') this.loadAccounts().catch(() => {});
        if (this.tab === 'env') this.loadEnv().catch(() => {});
      if (this.tab === 'cfg' && !this.cfgText) this.loadCfg().catch(() => {});
      }
    }
  },
  mounted() {
    this.tokenInput = this.token;
    this.refreshAll();
    this.timer = setInterval(this.tick, 3000);
  },
  unmounted() { clearInterval(this.timer); }
}).mount('#app');
</script>
</body>
</html>
