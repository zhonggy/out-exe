# OutlookAutomation 配置文件
# 相对路径基于用户数据目录（开发模式 = 项目根，打包后 = %APPDATA%\OutlookAutomation）

browser:
  # 内核选择：fingerprint = 指纹内核（自动定位）| patchright = 自带 Chromium | 绝对路径
  # 留空/auto = 先找指纹内核，没有则回退 patchright
  executable_path: "fingerprint"
  headless: false
  timeout: 60000                # 默认操作超时（毫秒）
  nav_timeout: 45000            # 页面导航超时（毫秒）
  locale: "zh-CN"               # 强制中文，元素定位依赖中文文案
  # 指纹伪装（仅 fingerprint-chromium 内核支持 --fingerprint 系列参数）
  fingerprint_enabled: true
  fingerprint_platform: "windows"
  fingerprint_brand: "Chrome"
  # 随机视口候选
  viewport_widths: [1366, 1440, 1536, 1680, 1920]
  viewport_heights: [768, 864, 900, 1050, 1080]

profile:
  root: "profiles"              # 每个环境独立目录（cookie / localStorage / 缓存）
  persistent: true              # true = launch_persistent_context，环境可复用
  reuse: false                  # false = 每次任务新建临时 profile（新身份）
  cleanup_on_exit: true         # 任务结束删除临时 profile

proxy:
  enabled: false
  mode: "single"                # single | pool
  type: "http"                  # http | socks5
  host: "127.0.0.1"
  single_port: 7890
  port_start: 24000
  port_end: 24064
  max_per_proxy: 20             # 单代理最大使用次数
  ip_info_lookup: true          # 通过 ipinfo.io 查询出口 IP 国家/时区
  ip_info_timeout: 8

# Resin 外部粘性代理池（启用后优先于上方 proxy 段）
# 启用后：浏览器走正向代理（Platform.Account 认证），框架自身 API 请求走反向代理（X-Resin-Account 头）
resin:
  enabled: false
  url: "http://127.0.0.1:2260/my-token"   # 代理基础地址 + Token
  platform: "Default"                      # 业务平台名（X-Resin-Account / 认证用户名前段）
  identity_mode: "email_prefix"            # 账号标识：email_prefix=@前缀 | email=完整邮箱（登录前稳定标识）

flow:
  login_url: "https://login.microsoftonline.com/"
  max_captcha_retries: 3
  captcha_strategy: 0           # 0=全自动按压  1=半自动(暂停等人工)
  captcha_screenshot: true      # 验证码失败时截图到 logs/captcha/
  wait_verify_timeout: 300      # WAIT_VERIFY 最长等待秒数
  checkpoint_enabled: true      # 保存流程节点，支持中断恢复

system:
  max_workers: 1                # 并发线程数（每个线程独占一个浏览器实例）
  task_retry: 1                 # 单任务失败重试次数
  accounts_file: "accounts.txt"
  account_separator: "----"

database:
  path: "data/app.db"

logger:
  dir: "logs"
  level: "INFO"                 # DEBUG | INFO | WARN | ERROR
  console: true
  file: true
  max_bytes: 10485760           # 单日志文件 10MB 后轮转
  backup_count: 5

scheduler:
  enabled: false
  jobs: []
    # - id: nightly_login
    #   flow: login
    #   cron: "0 3 * * *"
    #   accounts: "all"

update:
  repo: "zhonggy/out-exe"                    # GitHub 仓库，Release 从这里取
  asset_name: "OutlookAutomation-Setup.exe"  # 要下载的资产名
  include_prerelease: false                  # 是否把预发布版当作新版本
  timeout: 15                                # 网络请求超时秒数
